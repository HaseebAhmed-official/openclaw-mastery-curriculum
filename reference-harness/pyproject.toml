[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-harness-reference"
version = "0.2.0"
description = "Minimal educational reference harness for the Agent Harness Systems Engineering Curriculum"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.optional-dependencies]
interop = [
  "a2a-sdk[http-server]==1.1.2",
  "mcp==2.0.0",
  "opentelemetry-sdk==1.44.0",
]

[tool.setuptools.packages.find]
where = ["src"]
