[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-harness-reference"
version = "0.2.0"
description = "Minimal educational reference harness for the Agent Harness Systems Engineering Curriculum"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
